<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣石虎保育協會紅外線相機監測分析平台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) for reading and writing Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Leaflet CSS & JS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Proj4js for TWD97 -> WGS84 conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .tree-ul { padding-left: 1rem; border-left: 1px dashed #cbd5e1; }
        .tree-li { position: relative; margin: 2px 0; }
        .toggle-btn { cursor: pointer; display: inline-block; width: 16px; text-align: center; font-weight: bold; color: #64748b; }
        .toggle-btn:hover { color: #0f172a; }
        .custom-circle-icon { background: none; border: none; }
        .selected-species { background-color: #bfdbfe !important; }
        .species-drop-zone { min-height: 180px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 全局中央提示訊息小框 (3秒自動消失 Toast) -->
    <div id="toast-message" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 hidden bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-2xl font-bold text-center border border-emerald-400 transition-all duration-300">
        ✅ 動作成功完成！
    </div>

    <!-- 第一階層：檔案上傳畫面 -->
    <div id="view-upload" class="flex-1 flex flex-col justify-center items-center p-6">
        <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl mb-4">
                    <i data-lucide="paw-print" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">紅外線相機監測分析平台</h1>
                <p class="text-slate-500 text-sm mt-1">請上傳監測「資料表」與「物種名錄」以啟動生態分析</p>
            </div>

            <div class="space-y-4">
                <!-- 上傳資料表區塊 -->
                <div class="border-2 border-dashed border-slate-200 hover:border-emerald-500 rounded-xl p-6 text-center transition-colors cursor-pointer bg-slate-50 hover:bg-emerald-50/30" id="drop-zone-data" onclick="document.getElementById('file-data').click()" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleFileDrop(event, 'data')">
                    <input type="file" id="file-data" class="hidden" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event, 'data')">
                    <i data-lucide="file-spreadsheet" class="w-10 h-10 mx-auto text-slate-400 mb-2"></i>
                    <p class="text-sm font-semibold text-slate-700" id="label-data">1. 上傳相機監測資料表 (.xlsx / .csv)</p>
                    <p class="text-xs text-slate-400 mt-1">包含相機樣點、日期時間、點位座標等</p>
                </div>

                <!-- 上傳物種名錄區塊 -->
                <div class="border-2 border-dashed border-slate-200 hover:border-emerald-500 rounded-xl p-6 text-center transition-colors cursor-pointer bg-slate-50 hover:bg-emerald-50/30" id="drop-zone-taxonomy" onclick="document.getElementById('file-taxonomy').click()" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleFileDrop(event, 'taxonomy')">
                    <input type="file" id="file-taxonomy" class="hidden" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event, 'taxonomy')">
                    <i data-lucide="book-open" class="w-10 h-10 mx-auto text-slate-400 mb-2"></i>
                    <p class="text-sm font-semibold text-slate-700" id="label-taxonomy">2. 上傳對照物種名錄 (.xlsx / .csv)</p>
                    <p class="text-xs text-slate-400 mt-1">包含動物代號、綱目科屬種對照</p>
                </div>
            </div>

            <button id="btn-start-analysis" disabled onclick="initDashboard()" class="w-full mt-6 bg-slate-300 text-slate-500 font-bold py-3 px-4 rounded-xl shadow transition-all cursor-not-allowed flex items-center justify-center gap-2">
                <span>啟動分析系統</span>
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <!-- 第二階層：主分析儀表板 (Dashboard) -->
    <div id="view-dashboard" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- 頂部導覽與控制列 -->
        <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shrink-0 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-emerald-500 text-white rounded-lg">
                    <i data-lucide="paw-print" class="w-5 h-5"></i>
                </div>
                <h1 class="text-lg font-bold text-slate-800">紅外線相機監測數據分析</h1>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-lg text-xs">
                    <span class="text-slate-500 pl-2">分析區間:</span>
                    <input type="text" id="filter-start-date" placeholder="YYYY,MM" class="w-20 px-2 py-1 bg-white rounded border border-slate-200 focus:outline-none focus:border-emerald-500">
                    <span class="text-slate-400">~</span>
                    <input type="text" id="filter-end-date" placeholder="YYYY,MM" class="w-20 px-2 py-1 bg-white rounded border border-slate-200 focus:outline-none focus:border-emerald-500">
                    <button onclick="applyDateFilter()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded font-semibold transition-colors">重新過濾</button>
                </div>

                <!-- 檢視已被刪除的相機卷數回收站 -->
                <button onclick="toggleTrashModal()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-4 h-4 text-slate-500"></i>
                    <span>已刪除卷數 (<span id="trash-count">0</span>)</span>
                </button>

                <button onclick="resetApplication()" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold px-3 py-1.5 rounded-lg border border-rose-200 transition-colors flex items-center gap-1">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span>上傳新資料表</span>
                </button>
            </div>
        </header>

        <!-- KPI 數據核心指標卡片 -->
        <section class="grid grid-cols-4 gap-4 px-6 py-4 bg-slate-100 border-b border-slate-200 shrink-0">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase">總觀測點數</p>
                    <h3 class="text-2xl font-black text-slate-800 mt-1" id="kpi-sites">0</h3>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="map-pin"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase">偵測物種數</p>
                    <h3 class="text-2xl font-black text-slate-800 mt-1" id="kpi-species">0</h3>
                </div>
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl"><i data-lucide="trees"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase">有效照片數 (筆)</p>
                    <h3 class="text-2xl font-black text-slate-800 mt-1" id="kpi-photos">0</h3>
                </div>
                <div class="p-3 bg-amber-50 text-amber-600 rounded-xl"><i data-lucide="camera"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase">總有效工作時 (小時)</p>
                    <h3 class="text-2xl font-black text-slate-800 mt-1" id="kpi-hours">0</h3>
                </div>
                <div class="p-3 bg-purple-50 text-purple-600 rounded-xl"><i data-lucide="clock"></i></div>
            </div>
        </section>

        <!-- 分頁切換 Tab -->
        <nav class="bg-white px-6 border-b border-slate-200 flex gap-6 shrink-0">
            <button onclick="switchTab('tab-map')" id="tab-btn-map" class="py-3 font-bold border-b-2 border-emerald-500 text-emerald-600 flex items-center gap-2">
                <i data-lucide="map" class="w-4 h-4"></i> 1. 相機篩選及分布
            </button>
            <button onclick="switchTab('tab-hours')" id="tab-btn-hours" class="py-3 font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent flex items-center gap-2">
                <i data-lucide="history" class="w-4 h-4"></i> 2. 相機工作時
            </button>
            <button onclick="switchTab('tab-oi')" id="tab-btn-oi" class="py-3 font-semibold text-slate-500 hover:text-slate-800 border-b-2 border-transparent flex items-center gap-2">
                <i data-lucide="bar-chart-3" class="w-4 h-4"></i> 3. 有效照片數及OI值
            </button>
        </nav>

        <!-- 分頁 1: 相機篩選及分布 -->
        <div id="tab-map" class="flex-1 flex flex-col overflow-hidden p-6 gap-6">
            <!-- 上方地圖 (固定高度保障不消失) -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col relative h-[350px] shrink-0">
                <div id="leaflet-map" class="w-full h-full z-10"></div>
            </div>

            <!-- 下方相機點位控制樹狀結構 (左右並排設計) -->
            <div class="flex-1 bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex flex-col overflow-hidden min-h-[350px]">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="sliders" class="w-4 h-4 text-emerald-600"></i>
                        <span>相機計算模式與點位選擇</span>
                    </h2>
                    <!-- 模式切換主按鈕 -->
                    <div class="flex bg-slate-100 p-1 rounded-lg gap-1">
                        <button id="btn-mode-indiv" onclick="setCalculationMode('indiv')" class="px-6 py-1.5 text-sm font-bold rounded shadow-sm transition-all text-emerald-700 bg-white border border-slate-200">
                            採用 個別計算
                        </button>
                        <button id="btn-mode-group" onclick="setCalculationMode('group')" class="px-6 py-1.5 text-sm font-bold rounded transition-all text-slate-500 hover:text-slate-700">
                            採用 分區計算
                        </button>
                    </div>
                </div>

                <!-- 兩區容器 (左右並排) -->
                <div class="flex-1 grid grid-cols-2 gap-6 pt-4 overflow-hidden">
                    
                    <!-- 左側：個別計算樹狀區塊 -->
                    <div id="container-indiv-mode" class="border-2 border-emerald-400 rounded-xl p-3 bg-emerald-50/20 flex flex-col transition-all">
                        <div class="flex items-center justify-between mb-2 pb-2 border-b">
                            <span class="text-sm font-bold text-slate-700" id="indiv-title-label">1. 個別計算 (點位/卷數目錄)</span>
                            <div class="flex gap-2">
                                <button onclick="toggleAllCheckboxes(true)" class="text-xs text-emerald-600 hover:underline">全選</button>
                                <span class="text-slate-300">|</span>
                                <button onclick="toggleAllCheckboxes(false)" class="text-xs text-slate-400 hover:underline">取消</button>
                            </div>
                        </div>
                        <ul id="tree-indiv-camera" class="tree-ul text-xs flex-1 overflow-y-auto pr-2"></ul>
                    </div>

                    <!-- 右側：分區計算拖曳區塊 -->
                    <div id="container-group-mode" class="border border-slate-200 rounded-xl p-3 bg-slate-50 opacity-50 flex flex-col transition-all">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm font-bold text-slate-700 flex items-center gap-1">
                                <i data-lucide="layers" class="w-4 h-4 text-blue-600"></i> 2. 分區計算 (自訂群組)
                            </span>
                            <button onclick="addNewGroup()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-semibold px-2 py-1 rounded shadow-
